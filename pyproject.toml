[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "apns2"
version = "0.8.0"
description = "Apple Push Notification Service client over HTTP/2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sergey Petrov", email = "me@pr0ger.prg" }]
dependencies = [
    "cryptography>=43",
    "hyper>=0.7",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "freezegun>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["apns2"]

[tool.hatch.build.targets.sdist]
include = [
    "/apns2",
    "/test",
    "/LICENSE",
    "/README.md",
    "/MANIFEST.in",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pylint.design]
max-args = 10
max-attributes = 10

[tool.pylint.format]
max-line-length = 120

[tool.pylint.'messages control']
disable = "missing-docstring, too-few-public-methods, locally-disabled, invalid-name"

[tool.pytest.ini_options]
testpaths = ["test"]
